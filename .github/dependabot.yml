# 의존성 버전 갱신 PR을 월 1회, 생태계별로 묶어서 develop에 생성한다.
version: 2
updates:
  # /frontend는 Streamlit Community Cloud 전용 requirements.txt(루트와 같은 고정 버전 유지)
  - package-ecosystem: pip
    directories: ["/", "/frontend"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
