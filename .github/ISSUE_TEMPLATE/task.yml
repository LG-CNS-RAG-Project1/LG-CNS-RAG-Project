name: 작업·기능 요청
description: 새 기능, 개선, 조사 등 팀 작업을 등록한다.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 작업으로 얻으려는 결과를 작성한다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 작업과 제외할 작업을 목록으로 작성한다.
      placeholder: |
        - 포함:
        - 제외:
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      multiple: true
      options:
        - ingestion (수집·전처리)
        - retrieval (색인·검색)
        - generation (근거 검증·보고서)
        - frontend
        - evaluation
        - 환경 설정·CI
        - 문서
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 완료를 확인할 검증 방법을 작성한다.
      placeholder: |
        - [ ] 테스트 통과
        - [ ] README·docs 갱신
