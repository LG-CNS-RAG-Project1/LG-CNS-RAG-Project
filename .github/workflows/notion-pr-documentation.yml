name: Notion PR Documentation

on:
  pull_request_target:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged PR number targeting develop
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: notion-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-notion-record:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted develop workflow code
        uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Create a Notion page for the merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_PARENT_PAGE_ID: 40138f6e-d5a3-81e0-b65f-cf6212136450
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/create_notion_pr_page.mjs
