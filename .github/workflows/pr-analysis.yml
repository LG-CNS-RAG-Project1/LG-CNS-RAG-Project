name: PR Analysis

# develop 대상 PR을 GPT로 분석해 Notion 'PR 분석' 표의 PR별 페이지 하나에 기록하고,
# 병합되면 검증된 카드 변경만 '영역 카드'에 반영한다(참고용, GitHub에는 쓰지 않음).
# 분석기는 저장소 변수 REVIEW_PROVIDER로 하나만 고른다: codex(기본, Codex CLI + ChatGPT 구독 로그인) 또는 openai(API 키).
# pull_request_target이므로 develop에 있는 이 파일과 스크립트만 실행하고, PR 코드는 checkout하거나 실행하지 않는다.
# 초안 PR은 잡을 시작하지 않는다(초안 전환·닫힘은 상태 갱신용으로만 실행). 병합·닫힘·초안 전환에는 인증 정보를 넘기지 않는다.
# 켜고 끄기: 저장소 변수 REVIEW_ENABLED(전체)·REVIEW_LLM_ENABLED(AI 분석). 비밀값은 Environment pr-analysis에 둔다.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR 번호(task가 notion-check면 비워 둠)
        required: false
        type: number
      force:
        description: 같은 버전·재시도 한도·대기 시간을 무시하고 다시 분석
        type: boolean
        default: false
      task:
        description: analyze=분석·기록 / verify-model=Notion에 쓰지 않고 실제 PR로 모델 호출만 확인 / notion-check=Notion 읽기·쓰기 점검
        type: choice
        options: [analyze, verify-model, notion-check]
        default: analyze

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

# 같은 PR의 실행은 차례로 처리한다(병합 이벤트도 진행 중인 분석이 끝난 뒤 행 상태를 바꾼다).
# 모델 확인(verify-model)은 Notion에 쓰지 않으므로 따로 줄을 세워, PR 이벤트의 대기 실행을 밀어내지 않게 한다.
concurrency:
  group: pr-analysis-${{ inputs.task == 'verify-model' && 'verify-' || '' }}${{ github.event.pull_request.number || inputs.pr_number || 'notion-check' }}
  cancel-in-progress: false
  queue: max

jobs:
  analyze:
    name: PR 분석 (참고용)
    if: >-
      vars.REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.task != 'notion-check') ||
       (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        (github.event.pull_request.draft != true || github.event.action == 'closed' || github.event.action == 'converted_to_draft')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: pr-analysis
      deployment: false
    # 모델을 부르는 실행은 저장소 전체에서 한 줄로 세운다(ChatGPT 로그인 정보 하나를 동시에 쓰지 않기 위해).
    concurrency:
      group: ${{ (vars.REVIEW_LLM_ENABLED == 'true' || inputs.task == 'verify-model') && github.event.action != 'closed' && github.event.action != 'converted_to_draft' && 'pr-analysis-model' || format('pr-analysis-status-{0}', github.event.pull_request.number || inputs.pr_number || github.run_id) }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted develop scripts
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Codex CLI
        if: vars.REVIEW_PROVIDER != 'openai' && (vars.REVIEW_LLM_ENABLED == 'true' || inputs.task == 'verify-model') && github.event.action != 'closed' && github.event.action != 'converted_to_draft'
        env:
          CODEX_VERSION: "0.160.1"
        run: |
          npm install -g "@openai/codex@${CODEX_VERSION}"
          test "$(codex --version | awk '{print $2}')" = "${CODEX_VERSION}"

      - name: Check Codex tool isolation
        id: codex_policy
        if: vars.REVIEW_PROVIDER != 'openai' && (vars.REVIEW_LLM_ENABLED == 'true' || inputs.task == 'verify-model') && github.event.action != 'closed' && github.event.action != 'converted_to_draft'
        continue-on-error: true
        run: node scripts/review/codex_policy.mjs

      - name: Check Codex secret write access
        id: codex_pat
        if: steps.codex_policy.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ] || ! gh api "repos/$GITHUB_REPOSITORY/environments/pr-analysis/secrets/public-key" >/dev/null 2>&1; then
            echo "::error::Codex 로그인 정보 저장 권한을 확인할 수 없어 모델을 부르지 않습니다."
            exit 1
          fi

      # 자동화 전용 ChatGPT 로그인 정보(auth.json)를 임시 폴더에 복원한다. 값은 출력하지 않는다.
      - name: Restore Codex ChatGPT sign-in
        id: codex_auth
        if: steps.codex_pat.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          umask 077
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::warning::Environment pr-analysis에 CODEX_AUTH_JSON이 없어 모델을 부르지 않습니다."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/codex-home/auth.json"
          node scripts/review/mask_codex_auth.mjs "$RUNNER_TEMP/codex-home/auth.json" validate
          sha256sum "$RUNNER_TEMP/codex-home/auth.json" | cut -d' ' -f1 > "$RUNNER_TEMP/codex-auth.sha256"
          echo "home=$RUNNER_TEMP/codex-home" >> "$GITHUB_OUTPUT"

      - name: Analyze PR and record to Notion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_REVIEW_TOKEN: ${{ inputs.task != 'verify-model' && secrets.NOTION_REVIEW_TOKEN || '' }}
          OPENAI_API_KEY: ${{ vars.REVIEW_PROVIDER == 'openai' && github.event.action != 'closed' && github.event.action != 'converted_to_draft' && secrets.OPENAI_API_KEY || '' }}
          CODEX_HOME: ${{ steps.codex_auth.outputs.home }}
          NOTION_DASHBOARD_PAGE_ID: ${{ vars.NOTION_DASHBOARD_PAGE_ID }}
          NOTION_PR_DATABASE_ID: ${{ vars.NOTION_PR_DATABASE_ID }}
          NOTION_CARD_DATABASE_ID: ${{ vars.NOTION_CARD_DATABASE_ID }}
          NOTION_MEMORY_PAGE_ID: ${{ vars.NOTION_MEMORY_PAGE_ID }}
          REVIEW_LLM_ENABLED: ${{ inputs.task == 'verify-model' && 'true' || vars.REVIEW_LLM_ENABLED }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_EFFORT_FULL: ${{ vars.REVIEW_EFFORT_FULL }}
          REVIEW_EFFORT_INCREMENTAL: ${{ vars.REVIEW_EFFORT_INCREMENTAL }}
          REVIEW_MAX_OUTPUT_TOKENS_FULL: ${{ vars.REVIEW_MAX_OUTPUT_TOKENS_FULL }}
          REVIEW_MAX_OUTPUT_TOKENS_INCREMENTAL: ${{ vars.REVIEW_MAX_OUTPUT_TOKENS_INCREMENTAL }}
          REVIEW_INPUT_BUDGET_BYTES: ${{ vars.REVIEW_INPUT_BUDGET_BYTES }}
          REVIEW_ADMINS: ${{ vars.REVIEW_ADMINS }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.task == 'verify-model' && '1' || '' }}
          REVIEW_VERIFY_MODEL: ${{ inputs.task == 'verify-model' && '1' || '' }}
          CI_WAIT_SECONDS: ${{ inputs.task == 'verify-model' && '0' || '600' }}
        run: node scripts/review/analyze_pr.mjs

      - name: Report blocked model verification
        if: inputs.task == 'verify-model' && vars.REVIEW_PROVIDER != 'openai' && (steps.codex_policy.outcome != 'success' || steps.codex_pat.outcome != 'success' || steps.codex_auth.outputs.home == '')
        run: |
          echo "::error::Codex 보안 점검 또는 인증 준비가 완료되지 않아 모델 확인을 실행하지 못했습니다."
          exit 1

      # Codex가 실행 중 갱신한 로그인 정보만 Secret에 다시 저장한다(갱신하지 않으면 다음 실행부터 인증이 실패할 수 있음).
      # 쓰기에는 이 저장소의 Environments 쓰기 권한만 가진 토큰 CODEX_AUTH_WRITE_TOKEN을 쓰고, 끝나면 임시 파일을 지운다.
      - name: Save refreshed Codex sign-in
        if: always() && steps.codex_auth.outputs.home != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
          CODEX_HOME_DIR: ${{ steps.codex_auth.outputs.home }}
        run: |
          F="$CODEX_HOME_DIR/auth.json"
          if [ ! -s "$F" ]; then
            echo "::error::Codex 로그인 파일이 비어 있거나 없어 저장하지 않았습니다."
            exit 1
          fi
          node scripts/review/mask_codex_auth.mjs "$F" || true
          if [ "$(sha256sum "$F" | cut -d' ' -f1)" != "$(cat "$RUNNER_TEMP/codex-auth.sha256")" ]; then
            if ! node scripts/review/mask_codex_auth.mjs "$F" validate || ! jq -e '.tokens.refresh_token | strings | length > 0' "$F" >/dev/null; then
              echo "::error::갱신된 로그인 파일이 올바르지 않아 저장하지 않았습니다."
              exit 1
            fi
            if ! gh secret set CODEX_AUTH_JSON --env pr-analysis --repo "$GITHUB_REPOSITORY" < "$F" >/dev/null 2>&1; then
              echo "::error::갱신된 로그인 정보를 저장하지 못했습니다. 자동화 전용 로그인을 다시 등록하세요."
              exit 1
            fi
            echo "갱신된 Codex 로그인 정보를 Environment pr-analysis에 다시 저장했습니다."
          fi

      - name: Remove temporary Codex sign-in
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/codex-auth.sha256"

  # 병합된 PR(수동 분석 실행 포함)의 검증된 카드 변경을 영역 카드에 반영한다(모델 호출 없음, API 키 없음).
  # 여러 PR이 잇달아 병합돼도 같은 카드를 동시에 고치지 않도록 모든 카드 반영을 한 줄로 세워 차례로 처리한다.
  cards:
    name: 영역 카드 반영 (참고용)
    needs: analyze
    if: (github.event_name == 'workflow_dispatch' && inputs.task == 'analyze') || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pr-analysis
      deployment: false
    concurrency:
      group: pr-analysis-cards
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted develop scripts
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Apply verified card deltas in Notion
        env:
          REVIEW_STEP: cards
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          NOTION_DASHBOARD_PAGE_ID: ${{ vars.NOTION_DASHBOARD_PAGE_ID }}
          NOTION_PR_DATABASE_ID: ${{ vars.NOTION_PR_DATABASE_ID }}
          NOTION_CARD_DATABASE_ID: ${{ vars.NOTION_CARD_DATABASE_ID }}
          NOTION_MEMORY_PAGE_ID: ${{ vars.NOTION_MEMORY_PAGE_ID }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node scripts/review/analyze_pr.mjs

  # 수동 실행 전용: GitHub Actions의 Notion REST 연결로 표·페이지 ID를 읽고 시험용 페이지에서 쓰기·다시 읽기를 확인한다.
  notion-check:
    name: Notion 연결 점검
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'notion-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pr-analysis
      deployment: false
    steps:
      - name: Check out trusted develop scripts
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check Notion read and write
        env:
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          NOTION_PR_DATABASE_ID: ${{ vars.NOTION_PR_DATABASE_ID }}
          NOTION_CARD_DATABASE_ID: ${{ vars.NOTION_CARD_DATABASE_ID }}
          NOTION_DASHBOARD_PAGE_ID: ${{ vars.NOTION_DASHBOARD_PAGE_ID }}
          NOTION_MEMORY_PAGE_ID: ${{ vars.NOTION_MEMORY_PAGE_ID }}
          NOTION_SANDBOX_PAGE_ID: ${{ vars.NOTION_SANDBOX_PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/review/notion_check.mjs
