name: PR Analysis

# develop 대상 PR이 열리거나 수정되면 PR을 분석해 Notion 'PR 분석' 표에 기록한다(참고용, GitHub에는 쓰지 않음).
# pull_request_target이므로 develop에 있는 이 파일과 스크립트만 실행하고, PR 코드는 checkout하거나 실행하지 않는다.
# 켜고 끄기: 저장소 변수 REVIEW_ENABLED(전체)·REVIEW_LLM_ENABLED(AI 분석). 비밀값은 Environment pr-analysis에 둔다.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 분석할 PR 번호
        required: true
        type: number
      allow_draft:
        description: 초안 PR도 분석
        type: boolean
        default: false
      force:
        description: 이미 분석한 버전도 다시 분석
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: pr-analysis-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  analyze:
    name: PR 분석 (참고용)
    if: >-
      vars.REVIEW_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: pr-analysis
      deployment: false
    steps:
      - name: Check out trusted develop scripts
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Claude Code CLI
        if: vars.REVIEW_LLM_ENABLED == 'true' && github.event.action != 'closed'
        env:
          CLAUDE_CODE_VERSION: "2.1.308"
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          test "$(claude --version | cut -d' ' -f1)" = "${CLAUDE_CODE_VERSION}"

      - name: Analyze PR and record to Notion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_REVIEW_TOKEN: ${{ secrets.NOTION_REVIEW_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTION_DASHBOARD_PAGE_ID: ${{ vars.NOTION_DASHBOARD_PAGE_ID }}
          NOTION_PR_DATABASE_ID: ${{ vars.NOTION_PR_DATABASE_ID }}
          NOTION_MEMORY_PAGE_ID: ${{ vars.NOTION_MEMORY_PAGE_ID }}
          REVIEW_LLM_ENABLED: ${{ vars.REVIEW_LLM_ENABLED }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT }}
          REVIEW_ADMINS: ${{ vars.REVIEW_ADMINS }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ALLOW_DRAFT: ${{ inputs.allow_draft && 'true' || 'false' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/review/analyze_pr.mjs
