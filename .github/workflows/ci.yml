name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Black format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned black from requirements-dev.txt
        run: python -m pip install "$(grep -E '^black==' requirements-dev.txt)"

      - name: Check formatting
        run: black --check --diff .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          set +e
          python -m pytest
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice::수집된 테스트가 없어 통과 처리합니다."
            exit 0
          fi
          exit "$status"

  scc-deps:
    name: SCC dependency check
    runs-on: ubuntu-latest
    # Streamlit Community Cloud와 같은 Debian 11(SQLite 3.34)에서 SCC 전용 의존성으로 앱을 불러온다.
    container: python:3.12-slim-bullseye
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show SQLite version
        run: python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"

      - name: Install SCC dependencies
        run: python -m pip install -r frontend/requirements.txt "$(grep -E '^pytest==' requirements-dev.txt)"

      - name: Check thin client imports
        run: python scripts/check_scc_deps.py

      - name: Run SCC related tests
        run: >-
          python -m pytest
          tests/test_password_gate.py
          tests/test_chroma_client.py
          tests/test_requirements_sync.py
          tests/test_build_version.py

  scripts:
    name: Automation script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run Node.js tests
        run: node --test "scripts/**/*.test.mjs"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build development image
        run: docker compose build app
