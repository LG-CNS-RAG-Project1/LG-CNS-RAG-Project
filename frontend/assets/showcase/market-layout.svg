<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" rx="24" fill="#eaf2eb"/><g font-family="sans-serif" fill="#204a43"><text x="58" y="67" font-size="22" font-weight="700">IDEALENS / SCREEN PREVIEW</text><text x="58" y="120" font-size="34" font-weight="700">시장 검토 결과</text><rect x="58" y="147" width="1164" height="46" rx="10" fill="#d8e8dc"/><text x="80" y="178" font-size="20">화면 구성 예시 · 실제 조사 결과 / 대표도면 / 실험 수치가 아닙니다</text><rect x="58" y="225" width="372" height="365" rx="18" fill="#fffdf5" stroke="#ccdbca"/><text x="82" y="268" font-size="17" fill="#6a8976">01 / REVIEW</text><text x="82" y="316" font-size="23" font-weight="700">다섯 질문의 상태</text><text x="82" y="357" font-size="17" fill="#647e72">수요 · 경쟁 · 가격 · 구매자 · 장벽</text><rect x="82" y="402" width="302" height="12" rx="6" fill="#e1e9dc"/><rect x="82" y="437" width="268" height="12" rx="6" fill="#e1e9dc"/><rect x="82" y="472" width="286" height="12" rx="6" fill="#e1e9dc"/><rect x="82" y="528" width="230" height="30" rx="15" fill="#f2e9c9"/><text x="98" y="549" font-size="15" fill="#75632b">실제 캡처 준비 후 교체</text><rect x="454" y="225" width="372" height="365" rx="18" fill="#fffdf5" stroke="#ccdbca"/><text x="478" y="268" font-size="17" fill="#6a8976">02 / REVIEW</text><text x="478" y="316" font-size="23" font-weight="700">자료에서 확인한 것</text><text x="478" y="357" font-size="17" fill="#647e72">사실 문장과 출처를 함께</text><rect x="478" y="402" width="302" height="12" rx="6" fill="#e1e9dc"/><rect x="478" y="437" width="268" height="12" rx="6" fill="#e1e9dc"/><rect x="478" y="472" width="286" height="12" rx="6" fill="#e1e9dc"/><rect x="478" y="528" width="230" height="30" rx="15" fill="#f2e9c9"/><text x="494" y="549" font-size="15" fill="#75632b">실제 캡처 준비 후 교체</text><rect x="850" y="225" width="372" height="365" rx="18" fill="#fffdf5" stroke="#ccdbca"/><text x="874" y="268" font-size="17" fill="#6a8976">03 / REVIEW</text><text x="874" y="316" font-size="23" font-weight="700">다음에 확인할 것</text><text x="874" y="357" font-size="17" fill="#647e72">고객 인터뷰 · 견적 · 도입 조건</text><rect x="874" y="402" width="302" height="12" rx="6" fill="#e1e9dc"/><rect x="874" y="437" width="268" height="12" rx="6" fill="#e1e9dc"/><rect x="874" y="472" width="286" height="12" rx="6" fill="#e1e9dc"/><rect x="874" y="528" width="230" height="30" rx="15" fill="#f2e9c9"/><text x="890" y="549" font-size="15" fill="#75632b">실제 캡처 준비 후 교체</text><text x="58" y="656" font-size="20" fill="#52715f">자료에서 확인한 내용 → 아이디어에 대한 의미 → 다음 검증</text></g></svg>