# DART 사업보고서 수집 설정 (src/ingestion/dart_client.py, src/ingestion/dart_processor.py)
# 기업마다 관련 아이디어(idea_ids)와 선정 이유(reason)를 적는다. 선정 이유는 사업보고서
# '사업의 내용'에서 확인한 사업 범위이며, 기업 매출은 시장 규모·구매 수요의 증거가 아니다.
report:
  detail_type: A001  # 정기공시 > 사업보고서
  date_from: 20250101  # 이 날짜 이후 접수된 보고서 중 최신 사업연도
  request_interval_sec: 0.3
  # '사업의 내용' 하위 섹션 중 수집할 섹션의 제목 키워드 (원재료·위험관리 등은 제외)
  sections:
    - 사업의 개요
    - 주요 제품
    - 매출
    - 주요계약
    - 기타 참고사항
  # 이 키워드가 제목에 있는 섹션은 판매 실적·주요 매출처 공시라 구매 신호로 본다
  purchase_sections:
    - 매출
  chunk_size: 800
  chunk_overlap: 150

# 기업을 아이디어에 연결하려면 '사업의 내용' 본문에 이 용어가 1회 이상 나와야 한다.
# 나오지 않으면 그 아이디어 연결을 빼고 dart_selection.json에 사유를 남긴다.
# '비전'(경영 비전)·'음성'(지명)·'에너지 관리'(ESG)·'EMS'(전자제품 위탁생산 등)처럼
# 다른 뜻으로 쓰이는 넓은 용어는 쓰지 않는다. 사업보고서는 FEMS 대신 xEMS·에너지관리시스템으로 쓴다.
idea_terms:
  SF-01: [협동로봇]
  SF-02: [머신비전, 비전 검사, 비전검사, 외관검사, 외관 검사, 검사장비, 검사 장비]
  SF-03: [예지보전, 고장을 예지, 고장 예측, 예측정비, 상태감시, 예방진단]
  SF-04:
    - FEMS
    - xEMS
    - Energy Management System
    - 에너지관리시스템
    - 에너지 관리 시스템
    - 에너지통합관리
    - 공장에너지
    - 공장 에너지
    - 공정별 전력
  SF-05: [음성인식, 음성 인식, 생성형 AI, LLM, 공정제어]

