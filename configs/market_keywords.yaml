# 네이버 뉴스 검색 API 수집 설정과 아이디어별 시장 조사 키워드
# - news: 요청·페이지·최신성 기준
# - keywords: id는 원본 파일명에 쓰이므로 영문 소문자·밑줄만 사용
#   idea_ids는 평가 샘플(SF-01~SF-05), dimensions는 src.schemas.MarketDimension 값

news:
  sort: sim                   # sim(정확도순) | date(최신순, 키워드만 언급한 기사 비중 높음)
  display: 100                # 요청당 기사 수 (API 최대 100)
  max_items_per_keyword: 100  # 키워드당 저장할 최대 기사 수 (API 조회 한도 1000)
  date_from: 20240101         # 이 날짜(YYYYMMDD) 이전 기사는 저장하지 않음
  request_interval_sec: 0.2   # 연속 요청 간 대기 시간

keywords:
  # 공통: 스마트공장 보급·지원 정책
  - id: smart_factory
    query: 스마트공장
    idea_ids: [SF-01, SF-02, SF-03, SF-04, SF-05]
    dimensions: [demand, buyer]
  - id: smart_factory_support
    query: 스마트공장 지원사업
    idea_ids: [SF-01, SF-02, SF-03, SF-04, SF-05]
    dimensions: [buyer, adoption_barrier]

  # SF-01 협동로봇+비전 턴키 자동화
  - id: cobot_adoption
    query: 협동로봇 도입
    idea_ids: [SF-01]
    dimensions: [demand, buyer]
  - id: cobot_vision
    query: 협동로봇 비전 자동화
    idea_ids: [SF-01]
    dimensions: [competition]
  - id: cobot_price
    query: 협동로봇 가격
    idea_ids: [SF-01]
    dimensions: [price]

  # SF-02 2차전지·전자부품 AI 비전 외관 검사
  - id: ai_vision_inspection
    query: AI 비전검사
    idea_ids: [SF-02]
    dimensions: [demand, competition]
  - id: battery_inspection
    query: 2차전지 외관검사
    idea_ids: [SF-02]
    dimensions: [demand, buyer]

  # SF-03 진동·전류 센서 예지보전 SaaS
  - id: predictive_maintenance
    query: 예지보전
    idea_ids: [SF-03]
    dimensions: [demand, competition]
  - id: predictive_maintenance_solution
    query: 설비 예지보전 솔루션
    idea_ids: [SF-03]
    dimensions: [competition, price]

  # SF-04 공정별 전력 FEMS
  - id: fems
    query: FEMS 공장에너지관리시스템
    idea_ids: [SF-04]
    dimensions: [demand, competition]
  - id: factory_energy_cost
    query: 제조업 전력비 절감
    idea_ids: [SF-04]
    dimensions: [buyer, price]

  # SF-05 현장 작업자용 LLM 음성 어시스턴트
  - id: manufacturing_genai
    query: 제조 생성형 AI
    idea_ids: [SF-05]
    dimensions: [demand, competition]
  - id: worker_ai_assistant
    query: 현장 작업자 AI 어시스턴트
    idea_ids: [SF-05]
    dimensions: [competition, adoption_barrier]

  # 차원별 보강: 가격·구매자(도입 사례)·도입장벽 근거
  - id: smart_factory_barrier
    query: 스마트공장 도입 애로
    idea_ids: [SF-01, SF-02, SF-03, SF-04, SF-05]
    dimensions: [adoption_barrier]
  - id: sme_automation_cost
    query: 중소기업 자동화 설비 투자 비용
    idea_ids: [SF-01, SF-02, SF-03, SF-04, SF-05]
    dimensions: [price, adoption_barrier]
  - id: cobot_cost
    query: 협동로봇 도입 비용
    idea_ids: [SF-01]
    dimensions: [price]
  - id: cobot_case
    query: 협동로봇 도입 사례 중소기업
    idea_ids: [SF-01]
    dimensions: [buyer]
  - id: cobot_barrier
    query: 협동로봇 도입 어려움
    idea_ids: [SF-01]
    dimensions: [adoption_barrier]
  - id: vision_inspection_case
    query: 비전검사 도입 사례
    idea_ids: [SF-02]
    dimensions: [buyer]
  - id: vision_inspection_cost
    query: 비전검사 장비 가격
    idea_ids: [SF-02]
    dimensions: [price]
  - id: predictive_maintenance_case
    query: 예지보전 도입 사례
    idea_ids: [SF-03]
    dimensions: [buyer]
  - id: predictive_maintenance_cost
    query: 예지보전 구축 비용
    idea_ids: [SF-03]
    dimensions: [price]
  - id: fems_cost
    query: FEMS 구축 비용
    idea_ids: [SF-04]
    dimensions: [price]
  - id: fems_effect
    query: FEMS 도입 효과
    idea_ids: [SF-04]
    dimensions: [buyer]
  - id: manufacturing_ai_barrier
    query: 제조 AI 도입 장벽
    idea_ids: [SF-05]
    dimensions: [adoption_barrier]
  - id: factory_voice_ai
    query: 생산현장 음성 AI
    idea_ids: [SF-05]
    dimensions: [competition]
