# 키워드 동시 출현 네트워크 설정 (src/services/market_network.py)
# 아이디어 전체 문장과 가까운 뉴스의 제목·요약에서 명사를 뽑아, 같은 기사에 함께 나온 명사를 잇는다.
# 함께 나온다는 것은 같은 기사에서 다뤄졌다는 뜻이며 시장 수요나 인과관계의 근거가 아니다.
documents: 100  # 분석할 뉴스 수 (아이디어 전체 문장 기준 가까운 순, 재게재 기사를 뺀 뒤)
candidate_factor: 3  # 재게재 기사를 빼고도 documents건을 채우도록 documents × 이 값까지 가져온다
# 이미 고른 기사와 명사 집합 Jaccard 유사도가 이 값 이상이면 같은 소식의 재게재로 보고 뺀다.
# 한 소식이 여러 매체에 실리면 그 명사들이 묶음 하나를 차지한다. (시험: 다른 소식끼리 99%가 0.17 이하,
# 같은 소식 재게재는 0.3~0.6)
duplicate_similarity: 0.3
min_documents: 20  # 이보다 적으면 네트워크를 만들지 않는다
max_nodes: 30  # 표시할 명사 수 (특징 점수가 높은 순)
min_node_documents: 3  # 이보다 적은 기사에 나온 명사는 빼고
max_document_share: 0.6  # 이 비율보다 많은 기사에 나온 명사는 너무 일반적이라 뺀다
# lift = (아이디어 주변 기사 중 그 명사가 나온 비율) ÷ (전체 뉴스 중 비율). 이보다 낮은 명사는
# 어느 아이디어 주변에나 나오는 말이라 뺀다. 특징 점수는 기사 수 × ln(lift).
# (시험: 기술 1.1~1.5·AI 1.1~1.8, 협동로봇 3.2·고장 11.3·징후 14.6)
min_lift: 1.5
min_edge_documents: 2  # 함께 나온 기사가 이보다 적은 연결은 빼고
max_edges_per_node: 5  # 명사마다 가장 자주 함께 나온 연결만 남긴다
max_term_length: 12
# 기사 형식·시점·일반 동사성 명사 등 주제를 가리키지 않는 말. 도입·비용·부담·어려움은
# 도입장벽 묶음을 보여 주므로 넣지 않는다.
